<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | TaskHub'">TaskHub</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="navbar" class="nav">
  <a th:href="@{/}" class="logo">Task<span>Hub</span></a>
  <nav>
    <th:block sec:authorize="isAuthenticated()">
      <a th:href="@{/dashboard}">Dashboard</a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Users</a>
      <span class="who" sec:authentication="name">user</span>
      <form th:action="@{/logout}" method="post" class="inline">
        <button class="btn small" type="submit">Logout</button>
      </form>
    </th:block>
    <th:block sec:authorize="!isAuthenticated()">
      <a th:href="@{/login}">Login</a>
      <a th:href="@{/register}" class="btn small primary">Register</a>
    </th:block>
  </nav>
</header>
</body>
</html>
