<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container narrow">
  <div class="panel">
    <h1>Login</h1>
    <div class="alert error" th:if="${param.error}">Invalid email or password.</div>
    <div class="alert success" th:if="${param.logout}">You have been logged out.</div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <form th:action="@{/login}" method="post" class="stack">
      <label>Email
        <input type="email" name="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button class="btn primary" type="submit">Login</button>
    </form>
    <p class="muted">No account? <a th:href="@{/register}">Register</a></p>
  </div>
</main>
</body>
</html>
